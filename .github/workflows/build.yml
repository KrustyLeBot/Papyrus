# Tests on every push and pull request; the Docker image (linux/amd64: a Synology DS918+ is x86_64) is built each
# time and pushed to ghcr.io/krustylebot/papyrus only from main (:latest and :<run number>).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-test.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: System tools (OCR, PDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng tesseract-ocr-osd poppler-utils
      - name: Server dependencies
        run: pip install -r server/requirements.txt -r server/requirements-test.txt
      - name: Embeddings model (checked by SHA-256), so the semantic tests run for real
        working-directory: server
        run: |
          python -c "from pathlib import Path; from papyrus.embed import Embedder; d = Path('${{ runner.temp }}/e5'); import sys; sys.exit(0 if Embedder([d], download_dir=d, idle_minutes=0).download() else 1)"
          echo "PAPYRUS_TEST_MODEL=${{ runner.temp }}/e5" >> "$GITHUB_ENV"
      - name: Server tests
        working-directory: server
        run: python -m pytest tests -q
      - name: UI tests and build
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Pushed from main only: a pull request or a manual run elsewhere builds without publishing.
      - name: Log in to the GitHub container registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image, pushed from main only
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: BUILD=${{ github.run_number }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/krustylebot/papyrus:latest
            ghcr.io/krustylebot/papyrus:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
